cript>(function(){const defaultStart = "20:00";
const today = "2026-10-22";

    import { getBookings, getRooms, addBooking } from '../lib/store.mjs';
    import { createBooking } from '../lib/bookings.mjs';
    import { formatBookingSummary } from '../lib/time.mjs';

    const form = document.getElementById('booking-form');
    const roomSelect = document.getElementById('room');
    const dateInput = document.getElementById('date');
    const startSelect = document.getElementById('start');
    const durationSelect = document.getElementById('duration');
    const summary = document.getElementById('summary');
    const errorEl = document.getElementById('error');

    const rooms = getRooms();

    function roomName(id) {
      return rooms.find((r) => r.id === id)?.name || id;
    }

    function updateSummary() {
      const room = roomSelect.value;
      const date = dateInput.value;
      const start = startSelect.value;
      const duration = Number(durationSelect.value);

      errorEl.classList.add('hidden');

      if (!room || !date || !start || !duration) {
        summary.textContent = 'Completa los campos para ver el resumen.';
        return;
      }

      summary.textContent = formatBookingSummary(roomName(room), date, start, duration);
    }

    form.addEventListener('input', updateSummary);
    form.addEventListener('change', updateSummary);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const result = createBooking(
        {
          roomId: roomSelect.value,
          date: dateInput.value,
          start: startSelect.value,
          duration: Number(durationSelect.value),
        },
        getBookings(),
        new Date(`${today}T19:43:00`)
      );

      if (!result.ok) {
        errorEl.textContent = result.error;
        errorEl.classList.remove('hidden');
        return;
      }

      addBooking(result.booking);
      window.location.href = '/mis-reservas';
    });

    updateSummary();

    // Asegurar que el resumen se calcula una vez el DOM está estable.
    requestAnimationFrame(() => {
      updateSummary();
    });
  })();</script>  </main> <footer class="site-footer"> <div class="container footer-content"> <span>© 2026 ReservaLab</span> <span>Reserva de salas · demo</span> </div> </footer> <script>
      (function () {
        const toggle = document.getElementById('theme-toggle');
        const root = document.documentElement;
        const saved = sessionStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let dark = saved ? saved === 'dark' : prefersDark;

        function apply() {
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          toggle.textContent = dark ? '☀️' : '🌙';
        }

        apply();

        toggle.addEventListener('click', () => {
          dark = !dark;
          sessionStorage.setItem('theme', dark ? 'dark' : 'light');
          apply();
        });
      })();
    </script> </body> </html>
